<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2f87">
<title>Gimkana de cumpleaños 🎂</title>

<style>
/* =========================
   AJUSTES RÁPIDOS
   ========================= */

.login-card {
    width: min(78vw, 300px);
    margin-top: 55vh;
    padding: 15px;
    background: rgba(255,255,255,.6);
}

/* =========================
   VARIABLES
   ========================= */

:root {
    --pink: #ff2f87;
    --pink2: #d91f6c;
    --blue: #0b4f7a;
    --yellow: #ffd83d;
    --green: #20a66b;
    --red: #d64545;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    color: #17324d;
    background: linear-gradient(135deg, #fff8e9, #e8faff);
}

button, input {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   PORTADA Y ACCESO
   ========================= */

#login {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 18px;
    padding-bottom: 40px;
    justify-content: center;
    overflow: hidden;
}

.cover {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            rgba(0,0,0,.18)
        ),
        url('portada.png');
    background-size: cover;
    background-position: center;
}

.login-card {
    position: relative;
    width: min(78vw, 300px);
    margin-top: 55vh;
    padding: 15px;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(12px);
    border-radius: 26px;
    box-shadow: 0 18px 55px rgba(0,0,0,.25);
    text-align: center;
}

.login-card h1 {
    margin: 0 0 6px;
    color: var(--blue);
    font-size: 24px;
}

.login-card p {
    margin: 0 0 15px;
    color: #5e7180;
}

.error {
    margin-top: 9px;
    min-height: 22px;
    color: var(--red);
    font-weight: 800;
}

/* =========================
   CAMPOS Y BOTONES
   ========================= */

.field {
    width: 100%;
    min-width: 0;
    padding: 13px 15px;
    border: 2px solid #dbe5eb;
    border-radius: 15px;
    background: #fff;
    outline: 0;
}

.field:focus {
    border-color: var(--pink);
}

.primary {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: 0;
    border-radius: 15px;
    background: var(--pink);
    color: white;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--pink2);
}

.primary:active {
    transform: translateY(2px);
    box-shadow: 0 4px 0 var(--pink2);
}

.small {
    padding: 12px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--blue);
    color: white;
    font-weight: 850;
    cursor: pointer;
    flex-shrink: 0;
}

.back {
    margin-top: 14px;
    padding: 11px 15px;
    border: 0;
    border-radius: 14px;
    background: #edf3f6;
    color: var(--blue);
    font-weight: 850;
    cursor: pointer;
}

/* =========================
   APLICACIÓN
   ========================= */

.app {
    max-width: 760px;
    margin: auto;
    padding: 16px 16px 40px;
}

.top, .card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(20,35,60,.13);
}

.top {
    position: sticky;
    top: 10px;
    z-index: 5;
    padding: 18px;
}

.card {
    margin-top: 16px;
    padding: 18px;
}

.topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
}

.title {
    font-size: 24px;
    font-weight: 950;
    color: var(--blue);
}

.team {
    font-size: 14px;
    color: #6b7d89;
}

.counter {
    font-size: 21px;
    font-weight: 950;
    color: var(--pink);
}

/* =========================
   BARRA DE PROGRESO
   ========================= */

.progress {
    height: 11px;
    margin-top: 13px;
    background: #edf1f4;
    border-radius: 999px;
    overflow: hidden;
}

.bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--pink), #ff8c36);
    transition: width .35s;
}

/* =========================
   EQUIPO Y RESPUESTAS
   ========================= */

.team-row, .answer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
}

.answer-row .field {
    flex: 1;
}

.answer-row span {
    flex-shrink: 0;
}

.feedback {
    min-height: 24px;
    margin-top: 9px;
    font-weight: 850;
}

.ok {
    color: var(--green);
}

.bad {
    color: var(--red);
}

/* =========================
   TARJETAS DE PRUEBAS
   ========================= */

.tests {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
}

.test {
    min-height: 96px;
    padding: 14px;
    background: white;
    border: 2px solid #e7edf1;
    border-radius: 20px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(20,35,60,.06);
}

.test.done {
    background: #effbf5;
    border-color: #9be1c3;
}

.num {
    font-size: 12px;
    font-weight: 900;
    color: #7a8b96;
}

.name {
    margin-top: 5px;
    font-size: 17px;
    font-weight: 900;
}

.check {
    float: right;
    font-size: 21px;
}

/* =========================
   PANTALLA FINAL
   ========================= */

.finish {
    text-align: center;
    padding: 28px 12px;
}

.finish .emoji {
    font-size: 65px;
}

.finish h2 {
    margin: 8px 0;
    font-size: 31px;
    color: var(--pink);
}

.code {
    margin: 18px 0;
    padding: 12px;
    background: #fff4b8;
    border-radius: 16px;
    font-size: 27px;
    font-weight: 1000;
    letter-spacing: 2px;
}

/* =========================
   MÓVIL
   ========================= */

@media (max-width: 520px) {
    .tests {
        grid-template-columns: 1fr 1fr;
    }

    .name {
        font-size: 15px;
    }
}


/* GALERÍA DE FOTOS DE LA PRUEBA 1 */
.galeria-prueba1 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 24px;
}

.galeria-prueba1 img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    object-fit: contain;
}


.field.correcta {
    border: 2px solid #22a06b;
    background-color: #e8f8ef;
}

.field.incorrecta {
    border: 2px solid #dc3545;
    background-color: #fff0f0;
}

/* =========================
   PRUEBA FINAL: MENSAJE EN EL TEMPLO
   ========================= */

.test.final-test {
    position: relative;
    overflow: hidden;
    min-height: 125px;
    color: #fff3cf;
    background: linear-gradient(145deg, #172638, #30465a);
    border: 2px solid #d6ad58;
    box-shadow: 0 5px 18px rgba(91, 64, 20, .2);
}

.test.final-test .num {
    color: #e5c779;
    letter-spacing: 1.5px;
}

.test.final-test .name {
    color: #fff3cf;
    padding-right: 8px;
}

.test.final-test .check {
    color: #f6d77e;
}

.test.final-test.done {
    background: linear-gradient(145deg, #214b3b, #32634c);
    border-color: #a8dfb9;
}

.test.final-test.done .num,
.test.final-test.done .name {
    color: #fff;
}

/* PANTALLA FINAL A PANTALLA COMPLETA */

#finish {
    position: fixed;
    inset: 0;
    z-index: 9999;
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    border-radius: 0;
}

.final-celebration {
    min-height: 100%;
    width: 100%;
    padding: 35px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    background:
        radial-gradient(circle at top, #664477, transparent 55%),
        linear-gradient(145deg, #172638, #3b2456);
}

.final-icon {
    font-size: 80px;
    animation: trophyBounce 1.5s infinite;
}

.final-celebration h1 {
    color: #ffe08a;
    font-size: clamp(34px, 8vw, 58px);
    line-height: 1.1;
    margin: 15px 0;
    text-shadow: 0 4px 15px #0006;
}

.final-team {
    font-size: 24px;
}

.final-message {
    max-width: 650px;
    font-size: clamp(18px, 4vw, 23px);
    line-height: 1.5;
}

.final-message strong {
    color: #ffe08a;
}

.final-button {
    margin-top: 20px;
    padding: 16px 24px;
    border: 0;
    border-radius: 18px;
    background: #ffe08a;
    color: #172638;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
}

.confetti {
    font-size: 30px;
    margin-bottom: 15px;
}

@keyframes trophyBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
</style>
</head>

<body>

<!-- =========================
     PANTALLA DE ACCESO
     ========================= -->

<section id="login">
    <div class="cover"></div>

    <div class="login-card">
        <p>Para entrar escribe</p>

        <input
            id="celebrant"
            class="field"
            autocomplete="off"
            placeholder="Nombre de la cumpleañera"
        >

        <button id="enter" class="primary">
            Entrar a la gimkana
        </button>

        <div id="loginError" class="error"></div>
    </div>
</section>

<!-- =========================
     APLICACIÓN PRINCIPAL
     ========================= -->

<section id="app" class="hidden">
    <main class="app">

        <div class="top">
            <div class="topline">
                <div>
                    <div class="title">🎂 ¡A jugar!</div>
                    <div id="teamLabel" class="team">
                        Equipo sin nombre
                    </div>
                </div>

                <div id="counter" class="counter">0/8</div>
            </div>

            <div class="progress">
                <div id="bar" class="bar"></div>
            </div>
        </div>

        <div id="setup" class="card">
            <strong>👥 Nombre del equipo</strong>

            <div class="team-row">
                <input
                    id="teamInput"
                    class="field"
                    maxlength="30"
                    placeholder="Ej. Los Tigres"
                >

                <button id="saveTeam" class="small">
                    Guardar
                </button>
            </div>
        </div>

<div class="card" style="text-align:center;">
    <button class="back" onclick="reiniciarGimkana()">
        🔄 Reiniciar gimkana
    </button>
</div>


        <div id="home">
            <div id="grid" class="tests"></div>
        </div>

        <div id="test" class="card hidden"></div>

        <div id="finish" class="card hidden"></div>

    </main>
</section>

<script>

/* =========================
   CONFIGURACIÓN
   ========================= */

// Cambia aquí el nombre para entrar.
const CELEBRANT_NAME = "arabia";

// Lista de las diez pruebas.
// Las pruebas 2 a 10 siguen siendo demostraciones.
const tests = [
    {
        title: "Las Letras Perdidas",
        type: "placeholder",
        text: "Aquí pondremos la primera prueba."
    },
    {
        title: "Mensaje en el Templo",
        type: "secret",
        text: "Resuelve las cuatro pistas para descubrir el mensaje..."
    },
    {
        title: "El Objeto Infiltrado",
        type: "intruso",
        text: "Busca el objeto que desentona y escribe su nombre."
    },
    {
        title: "El Corazón de Arucas",
        type: "geroglifico",
        text: "Saca un selfie con la solución."
    },
    {
        title: "Ojo de Lince",
        type: "placeholder",
        text: "Encuentra las 5 diferencias."
    },
    {
        title: "La de Jack Sparrow",
        type: "placeholder",
        text: "Busca la fábrica."
    },
    {
        title: "El Edificio Desconocido",
        type: "placeholder",
        text: "Encuentra el edificio."
    },
    {
        title: "El Arte Escondido",
        type: "placeholder",
        text: "la de las esculturas"
    }
];

/* =========================
   ESTADO Y FUNCIONES GENERALES
   ========================= */

const state = {
    completed: JSON.parse(
        localStorage.getItem('gimkana_completed') || '[]'
    ),
    team: localStorage.getItem('gimkana_team') || ''
};

const $ = id => document.getElementById(id);

const norm = s => s
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();

function save() {
    localStorage.setItem(
        'gimkana_completed',
        JSON.stringify(state.completed)
    );

    localStorage.setItem('gimkana_team', state.team);
}

function progress() {
    const n = state.completed.length;

    $('counter').textContent = `${n}/8`;
    $('bar').style.width = `${n * 100 / 8}%`;

    $('teamLabel').textContent = state.team
        ? `Equipo: ${state.team}`
        : 'Equipo sin nombre';

    if (n === 8) {
        finish();
    }
}


function render() {
    const orden = tests
        .map((t, i) => i)
        .sort(() => Math.random() - 0.5);

    $('grid').innerHTML = orden.map(i => {
        const t = tests[i];
        const done = state.completed.includes(i);

        return `
            <button
    class="test ${done ? 'done' : ''} ${i === 1 ? 'final-test' : ''}"
    onclick="openTest(${i})"
>
                <span class="check">
                    ${done ? '✅' : '🔎'}
                </span>

                <div class="num">PRUEBA</div>

                <div class="name">${t.title}</div>
            </button>
        `;
    }).join('');
}


/* =========================
   SELECTOR DE PRUEBAS
   ========================= */

function openTest(i) {

    // La Prueba 2 será la última
    if (i === 1) {

        const otrasPruebas = [0, 2, 3, 4, 5, 6, 7];

        const todasCompletadas = otrasPruebas.every(
            prueba => state.completed.includes(prueba)
        );

        if (!todasCompletadas) {
            $('home').classList.add('hidden');
            $('finish').classList.add('hidden');
            $('test').classList.remove('hidden');

            $('test').innerHTML = `
                <h2>🔒 MENSAJE EN EL TEMPLO</h2>

                <p>¡Esta es la prueba final!</p>

                <p>
                    Primero tenéis que completar las otras
                    siete pruebas para poder desbloquearla.
                </p>

                <div style="text-align:center; font-size:60px; margin:25px 0;">
                    🔐
                </div>

                <button class="back" onclick="home()">
                    ← Volver
                </button>
            `;

            return;
        }
    }

    $('home').classList.add('hidden');
    $('finish').classList.add('hidden');
    $('test').classList.remove('hidden');

    // PRUEBA 1
    // Su contenido está en la función prueba1().
    if (i === 0) {
        prueba1();
        return;
    }

    // PRUEBA 2
    if (i === 1) {
    prueba2();
    return;
    }

    // PRUEBA 3: EL OBJETO INTRUSO
    if (i === 2) {
        prueba3();
        return;
    }

    // PRUEBA 4: A DE ARUCAS    
    if (i === 3) {
    prueba4();
    return;
}


    // PRUEBA 5: ENCUENTRA LAS 5 DIFERENCIAS
    if (i === 4) {
        prueba5();
        return;
    }

     // PRUEBA 6: RON
    if (i === 5) {
        prueba6();
        return;
    }


    // PRUEBA 7: TEST DE DOS PREGUNTAS
    if (i === 6) {
        prueba7();
        return;
    }

    // PRUEBA 8//
    if (i === 7) {
    prueba8();
    return;
}





    // RESTO DE PRUEBAS: DEMOSTRACIÓN
    const t = tests[i];

    $('test').innerHTML = `
        <h2>${t.title}</h2>

        <p>${t.text}</p>

        <button
            class="small"
            onclick="complete(${i})"
        >
            Marcar como hecha (demo)
        </button>

        <br>

        <button class="back" onclick="home()">
            ← Volver
        </button>
    `;
}

/* ==================================================
   PRUEBA 1: LAS LETRAS PERDIDAS
   ==================================================
   Aquí está todo el contenido visual de la prueba:
   instrucciones, campos, botones y mensajes.
   ================================================== */


function prueba1() {

    const completada = state.completed.includes(0);

    $('test').innerHTML = `
        <h2>🅰️ LAS LETRAS PERDIDAS</h2>

        <p>
            ${completada
                ? '✅ Esta prueba ya está completada.'
                : 'Exploradores, en el parque de Las Flores se ocultan cinco letras misteriosas.'
                
            }
        <p>
                Para encontrarlas, tendréis las fotografías que os darán una pista de donde se encuentran.
                Pero hay un secreto más...
        <p>
            ¡Cada letra esconde una palabra en su parte trasera!
            Cuando la encontreis escribidla en la posición correcta y descubriréis el mensaje.

        </p>

        <div class="answer-row">
            <input id="obj1" class="field"
                placeholder="Pista 1"
                value="${completada ? 'gracias' : ''}"
                ${completada ? 'disabled' : ''}>
            <span id="ok1">${completada ? '✅' : ''}</span>
        </div>

        <div class="answer-row">
            <input id="obj2" class="field"
                placeholder="Pista 2"
                value="${completada ? 'por' : ''}"
                ${completada ? 'disabled' : ''}>
            <span id="ok2">${completada ? '✅' : ''}</span>
        </div>

        <div class="answer-row">
            <input id="obj3" class="field"
                placeholder="Pista 3"
                value="${completada ? 'venir' : ''}"
                ${completada ? 'disabled' : ''}>
            <span id="ok3">${completada ? '✅' : ''}</span>
        </div>

        <div class="answer-row">
            <input id="obj4" class="field"
                placeholder="Pista 4"
                value="${completada ? 'a mi' : ''}"
                ${completada ? 'disabled' : ''}>
            <span id="ok4">${completada ? '✅' : ''}</span>
        </div>

        <div class="answer-row">
            <input id="obj5" class="field"
                placeholder="Pista 5"
                value="${completada ? 'cumpleaños' : ''}"
                ${completada ? 'disabled' : ''}>
            <span id="ok5">${completada ? '✅' : ''}</span>
        </div>

        <hr>

        <h3>✨ Mensaje</h3>

        <div
            style="
                font-size:24px;
                font-weight:900;
                color:#ff2f87;
                text-align:center;
                padding:15px 0;
            "
        >
            ${completada
                ? '🎉 ¡GRACIAS POR VENIR A MI CUMPLEAÑOS! 🎉'
                : '🔒 🔒 🔒 🔒 🔒'
            }
        </div>

        <div id="feedback" class="feedback ${completada ? 'ok' : ''}">
            ${completada
                ? '🎉 ¡Prueba completada!'
                : ''
            }
        </div>

        ${
            completada
            ? ''
            : `
                <button class="small" onclick="comprobarPrueba1()">
                    Comprobar respuestas
                </button>
            `
        }

        <br>

        <button class="back" onclick="home()">
            ← Volver
        </button> 


<div class="galeria-prueba1">
    <img src="./zona1.JPG" alt="Foto 1">
    <img src="./zona2.JPG" alt="Foto 2">
    <img src="./zona3.JPG" alt="Foto 3">
    <img src="./zona4.JPG" alt="Foto 4">
    <img src="./zona5.JPG" alt="Foto 5">
</div>

    `;
}

/* ==================================================
   PRUEBA 1: COMPROBACIÓN DE LAS RESPUESTAS
   ==================================================
   Esta función pertenece a la Prueba 1.
   Comprueba las cinco palabras y muestra los aciertos.
   ================================================== */

function comprobarPrueba1() {

    const answers = [
        "gracias",
        "por",
        "venir",
        "a mi",
        "cumpleaños"
    ];

    let correct = 0;

    for (let i = 1; i <= 5; i++) {

        const input = $('obj' + i);
        const feedback = $('ok' + i);

        // Ignorar los campos que ya se acertaron.
        if (input.disabled) {
            correct++;
            continue;
        }

        if (norm(input.value) === norm(answers[i - 1])) {

            // RESPUESTA CORRECTA
            input.style.borderColor = '#20a66b';
            input.style.background = '#effbf5';
            input.disabled = true;

            feedback.innerHTML = '✅';

            correct++;

        } else {

            // RESPUESTA INCORRECTA
            input.style.borderColor = '#d64545';
            input.style.background = '#fff5f5';

            feedback.innerHTML = '';
        }
    }

    // LAS CINCO RESPUESTAS SON CORRECTAS
    
if (correct === 5) {

    // Guardar la prueba como completada sin salir de ella.
    if (!state.completed.includes(0)) {
        state.completed.push(0);
        state.completed.sort((a, b) => a - b);
        save();
    }

    // Actualizar el contador y la barra de progreso.
    progress();
    render();

    // Mostrar el mensaje secreto y mantener la prueba abierta.
    $('feedback').innerHTML = `
        <div style="text-align:center; padding:15px 0;">
            <div style="font-size:45px;">🎉🎁🎉</div>
            <h2 style="color:#ff2f87;">
                ¡MENSAJE DESCUBIERTO!
            </h2>
            <p style="font-size:22px; font-weight:900;">
                ¡GRACIAS POR VENIR A MI CUMPLEAÑOS!
            </p>
            <p>¡Has encontrado todas las letras!</p>
        </div>
    `;

    $('feedback').className = 'feedback ok';

} else {

    $('feedback').innerHTML =
        `<span class="bad">Te faltan ${5 - correct} palabras.</span>`;
}

}


/* ==================================================
   PRUEBA 2: EL MENSAJE SECRETO
   ================================================== */


function prueba2() {

    const completada = state.completed.includes(1);

    $('test').innerHTML = `

function comprobarPrueba5() {
    const respuestasValidas = [
        ["luna", "cara", "circulo",],
        ["sol", "avion", "helicoptero","pez"],
        ["corazon", "cactus","planta"],
        ["montaña", "nieve","pico"],
        ["gafas","gafa", "hombre", "ojos","ojo"],
        ["barco","barca","barco pirata","velas"]
    ];

    const feedback = $('feedbackPrueba5');

    const respuestas = [1, 2, 3, 4, 5].map(n =>
        norm($('diferencia' + n).value)
    );

    // Reiniciar los colores.
    for (let n = 1; n <= 5; n++) {
        $('diferencia' + n).classList.remove(
            'correcta', 'incorrecta'
        );
    }

    if (respuestas.some(r => !r)) {
        feedback.textContent =
            "⚠️ Completad los cinco campos. Las respuestas correctas se marcarán en verde.";
        feedback.className = "feedback bad";
    }

    // Identificar qué diferencia corresponde a cada respuesta.
    const grupos = respuestasValidas.map(grupo =>
        grupo.map(norm)
    );

    const indices = respuestas.map(r =>
        r ? grupos.findIndex(grupo => grupo.includes(r)) : -1
    );

    // Detectar diferencias repetidas, incluso usando sinónimos.
    const cantidades = {};

    indices.forEach(i => {
        if (i !== -1) {
            cantidades[i] = (cantidades[i] || 0) + 1;
        }
    });

    let aciertos = 0;

    respuestas.forEach((respuesta, i) => {
        const campo = $('diferencia' + (i + 1));
        const diferencia = indices[i];

        const correcta =
            respuesta !== '' &&
            diferencia !== -1 &&
            cantidades[diferencia] === 1;

        if (correcta) {
            campo.classList.add('correcta');
            aciertos++;
        } else {
            campo.classList.add('incorrecta');
        }
    });

    if (aciertos === 5) {
        feedback.textContent =
            "🎉 ¡Perfecto! Habéis encontrado las cinco diferencias.";
        feedback.className = "feedback ok";
        complete(4);
    } else {
        feedback.textContent =
            ` lleváis ${aciertos} de 5 diferencias correctas. ¡Corregid las marcadas en rojo!`;
        feedback.className = "feedback bad";
    }
}

        state.completed.push(i);

    $('teamInput').value = '';

    // Volver a mostrar la configuración inicial
    $('setup').classList.remove('hidden');

    // Actualizar la pantalla
    render();
    progress();
    home();

    // Mostrar de nuevo la pantalla de acceso
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');

    // Limpiar el nombre introducido y los posibles errores
    $('celebrant').value = '';
    $('loginError').textContent = '';
}


/* =========================
   VOLVER AL MENÚ
   ========================= */

function home() {

    $('test').classList.add('hidden');
    $('finish').classList.add('hidden');
    $('home').classList.remove('hidden');
}

/* =========================
   PANTALLA FINAL
   ========================= */

function finish() {
    $('home').classList.add('hidden');
    $('test').classList.add('hidden');
    $('finish').classList.remove('hidden');

    $('finish').innerHTML = `
        <div class="final-celebration">
            <div class="confetti">🎉 ✨ 🎊</div>

            <div class="final-icon">🏆</div>

            <h1>¡GIMKANA COMPLETADA!</h1>

            <p class="final-team">
                ¡Enhorabuena, <strong>${state.team || 'equipo'}</strong>!
            </p>

            <p class="final-message">
    ¡Habéis superado todas las pruebas! 🎉<br><br>

    <strong>🏆 ¡MISIÓN CUMPLIDA!</strong><br><br>

    Pero antes de terminar, tenemos una última misión... 💌<br><br>

    <strong>Coged el papel que ya tenéis y escribidle un mensaje a la cumpleañera.</strong><br>
    Podéis escribirle una felicitación, un deseo,
    algo bonito que queráis decirle o un recuerdo que tengáis con ella. ❤️<br><br>

    <strong>¡Este mensaje será uno de vuestros regalos para Arabia! </strong><br>
    <strong>¡NOS VEMOS EN MC DONALDS!🍟 </strong>
</p>

            <button class="final-button" onclick="home()">
                🎉 VOLVER AL INICIO
            </button>
        </div>
    `;
}
/* =========================
   SEGURIDAD DEL TEXTO
   ========================= */

function safe(s) {
    return s.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[m]));
}

/* =========================
   ACCESO A LA GIMKANA
   ========================= */

$('enter').onclick = () => {

    const v = norm($('celebrant').value);

    if (!v) {
        $('loginError').textContent =
            'Escribe el nombre para continuar.';
        return;
    }

    if (v !== norm(CELEBRANT_NAME)) {
        $('loginError').textContent =
            '❌ Ese no es el nombre correcto.';
        return;
    }

    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');

    $('teamInput').value = state.team;

    render();
    progress();

    if (state.team) {
        $('setup').classList.add('hidden');
    }
};

$('celebrant').onkeydown = e => {
    if (e.key === 'Enter') {
        $('enter').click();
    }
};

/* =========================
   GUARDAR EL NOMBRE DEL EQUIPO
   ========================= */

$('saveTeam').onclick = () => {

    state.team = $('teamInput').value.trim();

    save();

    $('setup').classList.add('hidden');

    progress();
};


function comprobarIntruso() {
    const respuesta = norm($('respuestaIntruso').value);
    const correcta = "paraguas"; // Cambia aquí la respuesta correcta.
    const feedback = $('feedbackIntruso');

    if (respuesta === correcta) {
        feedback.textContent = "🎉 ¡Correcto! Has superado la prueba.";
        feedback.className = "feedback ok";

        complete(2);
    } else {
        feedback.textContent = "❌ No es correcto. ¡Inténtalo de nuevo!";
        feedback.className = "feedback bad";
    }
};


</script>
</body>
</html>
