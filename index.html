<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2f87">
<title>Gimkana de cumpleaños 🎂</title>
<style>
:root{--pink:#ff2f87;--pink2:#d91f6c;--blue:#0b4f7a;--yellow:#ffd83d;--green:#20a66b;--red:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324d;background:linear-gradient(135deg,#fff8e9,#e8faff);min-height:100vh}button,input{font:inherit}.hidden{display:none!important}
#login{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;overflow:hidden}.cover{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.18)),url('portada.png');background-size:cover;background-position:center}.login-card{position:relative;width:min(92vw,430px);margin-top:48vh;background:rgba(255,255,255,.95);padding:22px;border-radius:26px;box-shadow:0 18px 55px rgba(0,0,0,.25);text-align:center}.login-card h1{margin:0 0 6px;color:var(--blue);font-size:27px}.login-card p{margin:0 0 15px;color:#5e7180}.field{width:100%;border:2px solid #dbe5eb;border-radius:15px;padding:13px 15px;outline:0;background:#fff}.field:focus{border-color:var(--pink)}.primary{width:100%;border:0;border-radius:15px;padding:14px;margin-top:10px;background:var(--pink);color:#fff;font-weight:900;box-shadow:0 6px 0 var(--pink2);cursor:pointer}.primary:active{transform:translateY(2px);box-shadow:0 4px 0 var(--pink2)}.error{color:var(--red);font-weight:800;min-height:22px;margin-top:9px}
.app{max-width:760px;margin:auto;padding:16px 16px 40px}.top,.card{background:#fff;border-radius:24px;box-shadow:0 12px 30px rgba(20,35,60,.13)}.top{padding:18px;position:sticky;top:10px;z-index:5}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:24px;font-weight:950;color:var(--blue)}.team{font-size:14px;color:#6b7d89}.counter{font-size:21px;font-weight:950;color:var(--pink)}.progress{height:11px;background:#edf1f4;border-radius:999px;overflow:hidden;margin-top:13px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ff8c36);transition:width .35s}.card{margin-top:16px;padding:18px}.team-row,.answer-row{display:flex;gap:8px;margin-top:10px}.small{border:0;border-radius:14px;padding:12px 16px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.test{min-height:96px;background:#fff;border:2px solid #e7edf1;border-radius:20px;padding:14px;text-align:left;cursor:pointer;box-shadow:0 5px 15px rgba(20,35,60,.06)}.test.done{background:#effbf5;border-color:#9be1c3}.num{font-size:12px;color:#7a8b96;font-weight:900}.name{font-size:17px;font-weight:900;margin-top:5px}.check{float:right;font-size:21px}.feedback{min-height:24px;margin-top:9px;font-weight:850}.ok{color:var(--green)}.bad{color:var(--red)}.back{border:0;border-radius:14px;padding:11px 15px;margin-top:14px;background:#edf3f6;color:var(--blue);font-weight:850;cursor:pointer}.finish{text-align:center;padding:28px 12px}.finish .emoji{font-size:65px}.finish h2{font-size:31px;color:var(--pink);margin:8px 0}.code{font-size:27px;font-weight:1000;letter-spacing:2px;background:#fff4b8;border-radius:16px;padding:12px;margin:18px 0}
@media(max-width:520px){.login-card{margin-top:50vh}.tests{grid-template-columns:1fr 1fr}.name{font-size:15px}}
</style>
</head>
<body>
<section id="login">
<div class="cover"></div>
<div class="login-card">

<p>Escribe el nombre de la cumpleañera para entrar</p>
<input id="celebrant" class="field" autocomplete="off" placeholder="Nombre de la cumpleañera">
<button id="enter" class="primary">Entrar a la gimkana</button>
<div id="loginError" class="error"></div>
</div>
</section>
<section id="app" class="hidden">
<main class="app">
<div class="top"><div class="topline"><div><div class="title">🎂 ¡A jugar!</div><div id="teamLabel" class="team">Equipo sin nombre</div></div><div id="counter" class="counter">0/10</div></div><div class="progress"><div id="bar" class="bar"></div></div></div>
<div id="setup" class="card"><strong>👥 Nombre del equipo</strong><div class="team-row"><input id="teamInput" class="field" maxlength="30" placeholder="Ej. Los Tigres"><button id="saveTeam" class="small">Guardar</button></div></div>
<div id="home"><div id="grid" class="tests"></div></div>
<div id="test" class="card hidden"></div><div id="finish" class="card hidden"></div>
</main>
</section>
<script>
// ====== CAMBIA SOLO ESTO PARA PERSONALIZAR EL ACCESO ======
const CELEBRANT_NAME = "arabia";

// Más adelante sustituiremos estas 10 pruebas por las definitivas.
const tests=[
 {title:"Prueba 1",type:"placeholder",text:"Aquí pondremos la primera prueba."},
 {title:"Prueba 2",type:"placeholder",text:"Aquí pondremos la segunda prueba."},
 {title:"Prueba 3",type:"placeholder",text:"Aquí pondremos la tercera prueba."},
 {title:"Prueba 4",type:"placeholder",text:"Aquí pondremos la cuarta prueba."},
 {title:"Prueba 5",type:"placeholder",text:"Aquí pondremos la quinta prueba."},
 {title:"Prueba 6",type:"placeholder",text:"Aquí pondremos la sexta prueba."},
 {title:"Prueba 7",type:"placeholder",text:"Aquí pondremos la séptima prueba."},
 {title:"Prueba 8",type:"placeholder",text:"Aquí pondremos la octava prueba."},
 {title:"Prueba 9",type:"placeholder",text:"Aquí pondremos la novena prueba."},
 {title:"Prueba 10",type:"placeholder",text:"Aquí pondremos la décima prueba."}
];
const state={completed:JSON.parse(localStorage.getItem('gimkana_completed')||'[]'),team:localStorage.getItem('gimkana_team')||''};
const $=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
function save(){localStorage.setItem('gimkana_completed',JSON.stringify(state.completed));localStorage.setItem('gimkana_team',state.team)}
function progress(){let n=state.completed.length;$('counter').textContent=`${n}/10`;$('bar').style.width=`${n*10}%`;$('teamLabel').textContent=state.team?`Equipo: ${state.team}`:'Equipo sin nombre';if(n===10)finish()}
function render(){ $('grid').innerHTML=tests.map((t,i)=>{let d=state.completed.includes(i);return `<button class="test ${d?'done':''}" onclick="openTest(${i})"><span class="check">${d?'✅':'🔎'}</span><div class="num">PRUEBA ${i+1}</div><div class="name">${t.title}</div></button>`}).join('') }
function openTest(i){$('home').classList.add('hidden');$('finish').classList.add('hidden');$('test').classList.remove('hidden');let t=tests[i];$('test').innerHTML=`<h2>${t.title}</h2><p>${t.text}</p><p><em>Esta es una prueba provisional. La configuraremos juntos.</em></p><button class="small" onclick="complete(${i})">Marcar como hecha (demo)</button><br><button class="back" onclick="home()">← Volver</button>`}
function complete(i){if(!state.completed.includes(i)){state.completed.push(i);state.completed.sort((a,b)=>a-b);save()}render();progress();if(state.completed.length<10)home()}
function home(){$('test').classList.add('hidden');$('finish').classList.add('hidden');$('home').classList.remove('hidden')}
function finish(){$('home').classList.add('hidden');$('test').classList.add('hidden');$('finish').classList.remove('hidden');$('finish').innerHTML=`<div class="finish"><div class="emoji">🏆🎉</div><h2>¡GIMKANA COMPLETADA!</h2><p>Equipo: <strong>${safe(state.team||'sin nombre')}</strong></p><div class="code">¡FIESTA!</div><p>Enséñale esta pantalla a la persona organizadora.</p></div>`}
function safe(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('enter').onclick=()=>{let v=norm($('celebrant').value);if(!v){$('loginError').textContent='Escribe el nombre para continuar.';return}if(v!==norm(CELEBRANT_NAME)){$('loginError').textContent='❌ Ese no es el nombre correcto.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('teamInput').value=state.team;render();progress();if(state.team)$('setup').classList.add('hidden')};
$('celebrant').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};
$('saveTeam').onclick=()=>{state.team=$('teamInput').value.trim();save();$('setup').classList.add('hidden');progress()};
</script>
</body></html>
